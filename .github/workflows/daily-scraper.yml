name: Daily Rate Scraper

on:
  schedule:
    # Runs at 9 AM NZST (8 PM UTC)
    - cron: '0 20 * * *'
  
  workflow_dispatch:

jobs:
  scrape-rates:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium \
            ca-certificates \
            fonts-liberation \
            libappindicator3-1 \
            libasound2 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            xdg-utils

      - name: Check scraper API URL
        env:
          API_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "ERROR: RAILWAY_BACKEND_URL secret is not set"; exit 1
          fi
          echo "Using API_URL=$API_URL"
          curl -sSf "$API_URL/api/banks" -o /tmp/api-banks.json
          echo "Successfully fetched /api/banks"

      - name: Debug scraper folder
        run: |
          ls -la ./scraper
          cat ./scraper/package.json || true

      - name: Install scraper dependencies
        working-directory: ./scraper
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
        run: |
          npm config set progress=false
          npm ci --silent
        timeout-minutes: 10

      - name: Detect Chromium executable
        run: |
          if [ -x "/usr/bin/chromium-browser" ]; then
            echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser" >> $GITHUB_ENV
          elif [ -x "/usr/bin/chromium" ]; then
            echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium" >> $GITHUB_ENV
          else
            echo "ERROR: Chromium binary not found"; exit 1
          fi
              
      - name: Run scraper
        working-directory: ./scraper
        env:
          API_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
        run: node scraper.js --now
      
      - name: Check results
        if: success()
        run: echo "✅ Scraping completed at $(date)"
      
      - name: Notify on failure
        if: failure()
        run: echo "❌ Scraper failed - check logs above"