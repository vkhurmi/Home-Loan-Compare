name: Daily Rate Scraper

on:
  schedule:
    # Runs at 9 AM NZST (8 PM UTC)
    - cron: '0 20 * * *'
  
  workflow_dispatch:

jobs:
  scrape-rates:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium-browser \
            ca-certificates \
            fonts-liberation \
            libappindicator3-1 \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            xdg-utils
      
      - name: Install scraper dependencies
        working-directory: ./scraper
        run: npm install
      
      - name: Run scraper
        working-directory: ./scraper
        env:
          API_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
        run: node scraper.js --now
      
      - name: Check results
        if: success()
        run: echo "✅ Scraping completed at $(date)"
      
      - name: Notify on failure
        if: failure()
        run: echo "❌ Scraper failed - check logs above"